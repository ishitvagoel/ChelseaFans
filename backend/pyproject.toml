[project]
name = "chelsea-stats-api"
version = "1.0.0"
description = "Chelsea FC stats BFF — FastAPI, Clean Architecture"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "sqlmodel>=0.0.24",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.main:app"
